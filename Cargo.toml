[workspace]
members = [
    "crates/face-auth-core",
    "crates/face-auth",
    "crates/face-enroll",
    "crates/face-camera-diag",
    "crates/face-similarity-check",
    "crates/face-auth-tray",
]
resolver = "2"

[workspace.package]
license = "MIT"
publish = false

[workspace.dependencies]
tract-onnx = "0.23"
openvino = "0.11"
image = "0.25.4"
anyhow = "1.0"
thiserror = "2.0"
config = { version = "0.15", features = ["toml"] }
dirs = "7.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
byteorder = "1.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }