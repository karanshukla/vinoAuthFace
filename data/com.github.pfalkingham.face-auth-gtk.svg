<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4a5a" />
      <stop offset="100%" stop-color="#1e2a38" />
    </linearGradient>
    
    <!-- Glow Effect for the Scan Line -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Shape -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" />
  
  <!-- Face Recognition Brackets -->
  <path d="M 40 32 L 32 32 L 32 96 L 40 96" fill="none" stroke="#8ab4f8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 88 32 L 96 32 L 96 96 L 88 96" fill="none" stroke="#8ab4f8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Abstract Face Elements -->
  <!-- Left Eye -->
  <circle cx="48" cy="56" r="6" fill="#e8eaed" />
  <!-- Right Eye -->
  <circle cx="80" cy="56" r="6" fill="#e8eaed" />
  <!-- Simple Mouth Line -->
  <path d="M 56 80 Q 64 86 72 80" fill="none" stroke="#e8eaed" stroke-width="4" stroke-linecap="round" />

  <!-- Scanning Line -->
  <line x1="24" y1="64" x2="104" y2="64" stroke="#5eead4" stroke-width="3" filter="url(#glow)" />
  
  <!-- Subtle Scan Field Overlay -->
  <polygon points="24,64 104,64 96,96 32,96" fill="#5eead4" opacity="0.05" />
</svg>
