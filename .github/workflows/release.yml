name: Release binaries

# Builds static musl binaries so users can install without a Rust toolchain (deploy.sh falls
# back to downloading these when `cargo` isn't found). Only the default CPU/tract backend is
# built here: the `npu` feature dynamically links OpenVINO's own .so files and needs the actual
# OpenVINO runtime + NPU hardware present at build time, which a generic CI runner doesn't have
# — that build stays a local, deploy.sh-driven path (see deploy.sh's OpenVINO detection).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # musl-tools: musl-gcc, needed to link the static target. cmake: required by a transitive
      # dependency of face-similarity-check's image-decoding stack.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - name: Build release binaries (static musl, CPU/tract backend)
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl \
            -p face-auth -p face-enroll -p face-camera-diag -p face-similarity-check

      - name: Stage artifacts and checksums
        run: |
          mkdir -p dist
          for bin in face-auth face-enroll face-camera-diag face-similarity-check; do
            cp "target/x86_64-unknown-linux-musl/release/$bin" "dist/$bin-x86_64-unknown-linux-musl"
          done
          (cd dist && sha256sum -- * > SHA256SUMS)

      # Manual/branch runs just verify the build succeeds and leave artifacts attached to the
      # workflow run — only an actual tag push publishes a release, so a test run can't create
      # or clobber one.
      - name: Upload build artifact (manual/dry runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: face-auth-binaries
          path: dist/*

      # prerelease: true until there's been independent review of the recognition/liveness logic
      # and real-world validation beyond one developer's own hardware — this is security-critical
      # (biometric auth gating sudo/lock-screen) and bleeding-edge, not something to badge as a
      # GitHub "Latest" release yet. Flip this deliberately, not as a side effect of a version bump.
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          prerelease: true
