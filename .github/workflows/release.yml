name: Release binaries

# Builds static musl binaries so users can install without a Rust toolchain (deploy.sh falls
# back to downloading these when `cargo` isn't found). Only the default CPU/tract backend is
# built here: the `npu` feature dynamically links OpenVINO's own .so files and needs the actual
# OpenVINO runtime + NPU hardware present at build time, which a generic CI runner doesn't have
# — that build stays a local, deploy.sh-driven path (see deploy.sh's OpenVINO detection).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Two jobs so the write token never shares a runner with the build. Dependency build scripts
# and proc macros run during `cargo build`, so `build` gets a read-only token and no
# rust-cache (a restored cache is state other workflows wrote). `publish` only downloads
# the finished files and attaches them to the release.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-musl

      # musl-tools: musl-gcc, needed to link the static target. cmake: required by a transitive
      # dependency of vinoauthface-similarity-check's image-decoding stack.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      # `vinoauthface --version` and doctor report the tag; other builds say "dev".
      - name: Build release binaries (static musl, CPU/tract backend)
        env:
          VINOAUTHFACE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl \
            -p face-auth -p face-enroll -p face-camera-diag -p face-similarity-check -p face-auth-tray

      # Run what was just built before anything ships it: static, stamped with
      # the tag, and the PAM entry point exits the way pam_exec expects (1 for
      # no PAM_USER, 2 for a bad argument) rather than failing to start.
      - name: Smoke-test the binaries
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          dir=target/x86_64-unknown-linux-musl/release
          for bin in vinoauthface-auth vinoauthface vinoauthface-unseal vinoauthface-camera-diag vinoauthface-similarity-check vinoauthface-tray vinoauthface-helper; do
            file "$dir/$bin" | grep -Eq 'statically linked|static-pie linked' || { file "$dir/$bin"; exit 1; }
          done
          "$dir/vinoauthface" --version | tee /dev/stderr | grep -qF " $TAG"
          set +e
          env -i "$dir/vinoauthface-auth"; rc_pam=$?
          "$dir/vinoauthface-auth" --no-such-flag; rc_arg=$?
          set -e
          test "$rc_pam" = 1
          test "$rc_arg" = 2

      # The source bundle is what vinoauthface-upgrade installs from: the tag's tree plus a
      # VERSION file, which deploy.sh reads in place of `git describe`. Not GitHub's own
      # tag tarballs: they aren't in SHA256SUMS, and their bytes have changed before.
      - name: Stage artifacts and checksums
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          mkdir -p dist
          for bin in vinoauthface-auth vinoauthface vinoauthface-unseal vinoauthface-camera-diag vinoauthface-similarity-check vinoauthface-tray vinoauthface-helper; do
            cp "target/x86_64-unknown-linux-musl/release/$bin" "dist/$bin-x86_64-unknown-linux-musl"
          done
          git archive --format=tar.gz --prefix="vinoauthface-$TAG/" \
            --add-virtual-file="vinoauthface-$TAG/VERSION:$TAG" \
            -o dist/vinoauthface-source.tar.gz HEAD
          (cd dist && sha256sum -- * > SHA256SUMS)

      # Every run uploads dist/. Manual/branch runs stop there and leave it attached to the
      # workflow run; only an actual tag push publishes a release, so a test run can't create
      # or clobber one.
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vinoauthface-binaries
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vinoauthface-binaries
          path: dist

      # Full releases (not pre-releases) since v2, so GitHub's "latest" and the repo sidebar
      # point at them and releases/latest/download/... URLs resolve. Revert to prerelease: true
      # deliberately if a release shouldn't be offered as the current one.
      - name: Publish release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          prerelease: false
          generate_release_notes: true
