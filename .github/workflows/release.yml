name: Release binaries

# Builds static musl binaries so users can install without a Rust toolchain (deploy.sh falls
# back to downloading these when `cargo` isn't found). Only the default CPU/tract backend is
# built here: the `npu` feature dynamically links OpenVINO's own .so files and needs the actual
# OpenVINO runtime + NPU hardware present at build time, which a generic CI runner doesn't have
# — that build stays a local, deploy.sh-driven path (see deploy.sh's OpenVINO detection).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # musl-tools: musl-gcc, needed to link the static target. cmake: required by a transitive
      # dependency of vinoauthface-similarity-check's image-decoding stack.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      # `vinoauthface --version` and doctor report the tag; other builds say "dev".
      - name: Build release binaries (static musl, CPU/tract backend)
        env:
          VINOAUTHFACE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl \
            -p face-auth -p face-enroll -p face-camera-diag -p face-similarity-check -p face-auth-tray

      # The source bundle is what vinoauthface-upgrade installs from: the tag's tree plus a
      # VERSION file, which deploy.sh reads in place of `git describe`. Not GitHub's own
      # tag tarballs: they aren't in SHA256SUMS, and their bytes have changed before.
      - name: Stage artifacts and checksums
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          mkdir -p dist
          for bin in vinoauthface-auth vinoauthface vinoauthface-camera-diag vinoauthface-similarity-check vinoauthface-tray vinoauthface-helper; do
            cp "target/x86_64-unknown-linux-musl/release/$bin" "dist/$bin-x86_64-unknown-linux-musl"
          done
          git archive --format=tar.gz --prefix="vinoauthface-$TAG/" \
            --add-virtual-file="vinoauthface-$TAG/VERSION:$TAG" \
            -o dist/vinoauthface-source.tar.gz HEAD
          (cd dist && sha256sum -- * > SHA256SUMS)

      # Manual/branch runs just verify the build succeeds and leave artifacts attached to the
      # workflow run — only an actual tag push publishes a release, so a test run can't create
      # or clobber one.
      - name: Upload build artifact (manual/dry runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vinoauthface-binaries
          path: dist/*

      # Full releases (not pre-releases) since v2, so GitHub's "latest" and the repo sidebar
      # point at them and releases/latest/download/... URLs resolve. Revert to prerelease: true
      # deliberately if a release shouldn't be offered as the current one.
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          prerelease: false
          generate_release_notes: true
