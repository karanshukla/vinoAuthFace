name: CI

# Runs on every push/PR (unlike release.yml, which only fires on version tags). Exercises the
# things a contributor or a downstream packager would actually rely on: the test suite, building
# from source, and every branch of deploy.sh's cargo-availability fallback chain — including the
# checksum-verified download path, using FACE_AUTH_DEPLOY_RELEASE_BASE (a file:// override) so
# that branch is deterministically testable without depending on a real published release or
# GitHub's API being reachable from the runner.
#
# push is scoped to main only, not every branch: a branch with an open PR against it would
# otherwise fire both push and pull_request for the same commit, running everything twice.
# pull_request already covers feature-branch work; push:main covers direct pushes/merges.
on:
  push:
    branches: ["main"]
  pull_request: {}

permissions:
  contents: read

jobs:
  # fmt is deliberately not enforced: upstream authFace is not rustfmt-clean,
  # and reformatting its files would turn every resync into conflicts.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      # --locked: build against exactly what's committed in Cargo.lock, erroring loudly if it's
      # out of date instead of silently re-resolving to something never actually tested locally.
      # One at a time: bash -n parses only its first argument, the rest are its $@.
      - name: Syntax-check shell scripts
        run: |
          for script in deploy.sh uninstall.sh pin-camera.sh update.sh upgrade.sh login-mode.sh setting-mode.sh \
              install.sh scripts/*.sh; do
            bash -n "$script"
          done

      - name: Run unit tests
        run: cargo test --workspace --locked

      - name: Build from source (static musl, all crates)
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl \
            -p face-auth -p face-enroll -p face-camera-diag -p face-similarity-check -p face-auth-tray

  # deploy.sh's real integration test: everything it does system-wide (PAM patching, SELinux
  # detection, embeddings dir) on a throwaway VM instead of a contributor's or a reviewer's own
  # machine. No IR camera is present, so this can't verify authentication itself — just that the
  # script's install/build/download logic does what it claims.
  deploy-script:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      # swaylock: requisite gates above the authenticator must stay above
      # face-auth. gdm-password: its included stack already runs face-auth,
      # so deploy.sh must leave it alone rather than scan twice.
      - name: Stage PAM fixtures
        run: |
          printf '%s\n' '#%PAM-1.0' \
            'auth       requisite    pam_nologin.so' \
            'auth       required     pam_faillock.so preauth' \
            'auth       include      login' | sudo tee /etc/pam.d/swaylock
          echo 'auth sufficient pam_exec.so quiet stdout /usr/local/bin/vinoauthface-auth' | sudo tee /etc/pam.d/face-auth-ci-stack
          printf '%s\n' '#%PAM-1.0' '@include face-auth-ci-stack' | sudo tee /etc/pam.d/gdm-password
          sudo cp /etc/pam.d/gdm-password /tmp/gdm-password.orig
          # A vendor-only service: deploy.sh must copy it to /etc/pam.d to patch it.
          printf '%s\n' '#%PAM-1.0' 'auth       include      login' | sudo tee /usr/lib/pam.d/cosmic-greeter
          # A second one that stays untouched: uninstall must delete it outright.
          printf '%s\n' '#%PAM-1.0' 'auth       include      login' | sudo tee /usr/lib/pam.d/kde-fingerprint
          # Plasma Login without the -fingerprint service, as on Fedora 45.
          printf '%s\n' '#%PAM-1.0' 'auth       substack     password-auth' 'auth       include      postlogin' \
            | sudo tee /usr/lib/pam.d/plasmalogin

      - name: "Branch 1: cargo present -> build from source"
        run: |
          sudo ./deploy.sh --with-tray 2>&1 | tee /tmp/deploy.log
          # ubuntu-latest has no SELinux: deploy.sh must skip the policy quietly.
          grep -q 'SELinux not enabled' /tmp/deploy.log
          ! grep -q "Tools not found" /tmp/deploy.log
          test "$(grep -nE 'pam_faillock|face-auth|include' /etc/pam.d/swaylock | cut -d: -f1 | tr '\n' ' ')" = "3 4 5 "
          grep -A1 'pam_exec\.so.*face-auth' /etc/pam.d/sudo | grep -q '@include common-auth'
          cmp /etc/pam.d/gdm-password /tmp/gdm-password.orig
          grep -q 'pam_exec\.so.*face-auth' /etc/pam.d/cosmic-greeter
          # No fprintd: the fingerprint slot, failing rather than falling through.
          grep -qE '^auth +\[success=done new_authtok_reqd=done default=die\] +pam_exec\.so.*vinoauthface-auth' /etc/pam.d/kde-fingerprint
          test -x /usr/local/bin/vinoauthface-auth
          test -g /usr/local/bin/vinoauthface-auth
          test "$(stat -c %G /usr/local/bin/vinoauthface-auth)" = face-auth
          test -x /usr/local/bin/vinoauthface
          test "$(stat -c %U:%G:%a /usr/local/libexec/vinoauthface-unseal)" = root:root:755
          grep -q improve /usr/local/share/bash-completion/completions/vinoauthface
          grep -q improve /usr/local/share/zsh/site-functions/_vinoauthface
          grep -q improve /usr/local/share/fish/vendor_completions.d/vinoauthface.fish
          grep -q 'pam_exec\.so.*face-auth' /etc/pam.d/sudo
          test "$(stat -c %a /var/lib/face-auth)" = 2750
          test "$(stat -c %U:%a /var/cache/face-auth)" = root:755
          test "$(stat -c %U:%a /usr/local/share/face-auth/uninstall.sh)" = root:755
          # The login screen is opt-in: a fresh install leaves it alone.
          grep -q 'Plasma login screen: password only' /tmp/deploy.log
          test ! -e /etc/pam.d/plasmalogin

      # update.sh swaps only the binaries: same modes as deploy.sh, and a
      # second run with nothing rebuilt changes nothing.
      - name: update.sh keeps modes and is a no-op when unchanged
        run: |
          sudo ./update.sh 2>&1 | tee /tmp/update.log
          test -g /usr/local/bin/vinoauthface-auth
          test "$(stat -c %U:%G:%a /usr/local/bin/vinoauthface-auth)" = root:face-auth:2755
          test "$(stat -c %U:%a /usr/local/bin/vinoauthface)" = root:755
          test "$(stat -c %U:%a /usr/local/libexec/vinoauthface-helper)" = root:755
          grep -q 'Nothing changed' /tmp/update.log
          grep -q 'pam_exec\.so.*face-auth' /etc/pam.d/sudo

      # What the tray's login-screen entries run through the helper.
      - name: Login screen modes
        run: |
          lm=/usr/local/share/face-auth/login-mode.sh
          test "$(stat -c %U:%a "$lm")" = root:755
          test "$("$lm" status)" = off
          # both: required, below the password stack.
          sudo "$lm" both
          test "$("$lm" status)" = both
          sed -n 3p /etc/pam.d/plasmalogin | grep -qE '^auth +required +pam_exec\.so.*vinoauthface-auth'
          sed -n 2p /etc/pam.d/plasmalogin | grep -q substack
          # face: sufficient, above it, and only one line.
          sudo "$lm" face
          test "$("$lm" status)" = face
          sed -n 2p /etc/pam.d/plasmalogin | grep -qE '^auth +sufficient +pam_exec\.so.*vinoauthface-auth'
          test "$(grep -c face-auth /etc/pam.d/plasmalogin)" = 1
          # off: the override it created goes again.
          sudo "$lm" off
          test "$("$lm" status)" = off
          test ! -e /etc/pam.d/plasmalogin
          test ! -e /etc/pam.d/.face-auth-plasmalogin-created
          # Left on, for uninstall to clean up below.
          sudo "$lm" face

      # What the tray's Settings menu runs through the helper.
      - name: Settings menu
        run: |
          sm=/usr/local/share/face-auth/setting-mode.sh
          test "$(stat -c %U:%a "$sm")" = root:755
          "$sm" status | grep -qx 'security balanced'
          sudo "$sm" set security strict
          "$sm" status | grep -qx 'security strict'
          sudo "$sm" set scan 8s
          sudo "$sm" set security convenient
          "$sm" status | grep -qx 'security convenient'
          "$sm" status | grep -qx 'scan 8s'
          # One line per key, and the file still parses for the auth path.
          test "$(grep -c '^liveness.preset' /etc/face-auth.toml)" = 1
          test "$(grep -cE '^(guards[.])?start_delay_ms' /etc/face-auth.toml)" = 1
          # Nothing outside the menu can be set, including a preset's parts.
          if sudo "$sm" set lockout off; then exit 1; fi
          if sudo "$sm" set liveness off; then exit 1; fi
          if sudo "$sm" set scan 1s; then exit 1; fi
          sudo "$sm" set security balanced
          sudo "$sm" set scan 5s

      # The helper is the tray's only root entry point: it must refuse
      # anything that did not come through pkexec, and any named target.
      - name: Tray files and helper checks
        run: |
          test -x /usr/local/bin/vinoauthface-tray
          test "$(stat -c %U:%a /usr/local/libexec/vinoauthface-helper)" = root:755
          policy=/usr/share/polkit-1/actions/io.github.karanshukla.vinoauthface.policy
          # 7 fixed verbs plus one per Settings choice (helper.rs checks the policy against its table).
          test "$(grep -c 'exec.argv1' "$policy")" = 18
          test "$(grep -c '<allow_active>auth_admin</allow_active>' "$policy")" = 18
          test -f /etc/xdg/autostart/vinoauthface-tray.desktop
          test -f /usr/local/share/applications/vinoauthface-enrol.desktop
          test -f /usr/local/share/icons/hicolor/scalable/apps/vinoauthface.svg
          test -f /usr/local/share/icons/hicolor/symbolic/apps/vinoauthface-symbolic.svg
          # `! cmd` is exempt from set -e, so spell the failure out.
          refuses() { if "$@"; then echo "helper accepted: $*"; exit 1; fi; }
          refuses sudo /usr/local/libexec/vinoauthface-helper enrol
          refuses sudo env PKEXEC_UID="$(id -u)" /usr/local/libexec/vinoauthface-helper enrol --user root
          refuses sudo env PKEXEC_UID="$(id -u)" /usr/local/libexec/vinoauthface-helper enroll
          refuses sudo env PKEXEC_UID="$(id -u)" /usr/local/libexec/vinoauthface-helper upgrade v1
          refuses sudo env PKEXEC_UID="$(id -u)" /usr/local/libexec/vinoauthface-helper login-face off
          refuses /usr/local/libexec/vinoauthface-helper enrol
          # Not enrolled: --enrolled answers 1 (no), not 2 (error).
          set +e; /usr/local/bin/vinoauthface-auth --enrolled; rc=$?; set -e
          test "$rc" = 1

      # deploy.sh records the sha256 of each vendor copy it created. A copy the
      # user edited afterwards must survive uninstall (minus our line); an
      # untouched one is deleted. A file deploy.sh only patched keeps edits
      # made since: uninstall strips our line rather than restoring the .bak.
      - name: Reset install
        run: |
          refuses() { if "$@"; then echo "uninstall accepted: $*"; exit 1; fi; }
          refuses ./uninstall.sh
          refuses sudo ./uninstall.sh --purgee
          grep -q 'pam_exec\.so.*face-auth' /etc/pam.d/sudo
          test -f /etc/pam.d/sudo.face-auth.bak
          test -s /etc/pam.d/.face-auth-cosmic-greeter-created
          echo 'auth       optional     pam_permit.so' | sudo tee -a /etc/pam.d/cosmic-greeter
          echo '# edited after deploy' | sudo tee -a /etc/pam.d/sudo
          sudo ./uninstall.sh
          grep -q 'edited after deploy' /etc/pam.d/sudo
          if grep -q face-auth /etc/pam.d/sudo; then exit 1; fi
          test ! -e /etc/pam.d/sudo.face-auth.bak
          sudo sed -i '/edited after deploy/d' /etc/pam.d/sudo
          test -f /etc/pam.d/cosmic-greeter
          grep -q pam_permit /etc/pam.d/cosmic-greeter
          if grep -q face-auth /etc/pam.d/cosmic-greeter; then exit 1; fi
          test ! -e /etc/pam.d/.face-auth-cosmic-greeter-created
          sudo rm /etc/pam.d/cosmic-greeter
          test ! -e /etc/pam.d/kde-fingerprint
          test ! -e /etc/pam.d/plasmalogin
          test ! -e /var/cache/face-auth
          test ! -e /usr/local/share/bash-completion/completions/vinoauthface
          test ! -e /usr/local/share/zsh/site-functions/_vinoauthface
          test ! -e /usr/local/share/fish/vendor_completions.d/vinoauthface.fish
          test ! -e /usr/local/libexec/vinoauthface-unseal
          test ! -e /usr/local/bin/vinoauthface-tray
          test ! -e /usr/local/libexec/vinoauthface-helper
          test ! -e /usr/share/polkit-1/actions/io.github.karanshukla.vinoauthface.policy
          test ! -e /etc/xdg/autostart/vinoauthface-tray.desktop

      # Also: fprintd owns kde-fingerprint, so face takes the smartcard slot.
      - name: "Branch 2: no cargo -> reuse local target/ binaries"
        run: |
          printf '%s\n' '#%PAM-1.0' 'auth       required     pam_fprintd.so' | sudo tee /usr/lib/pam.d/kde-fingerprint
          printf '%s\n' '#%PAM-1.0' 'auth       include      login' | sudo tee /usr/lib/pam.d/kde-smartcard
          mv "$HOME/.cargo/bin" "$HOME/.cargo/bin.hidden"
          sudo env PATH="/usr/sbin:/usr/bin:/sbin:/bin" ./deploy.sh
          test -x /usr/local/bin/vinoauthface-auth
          test -x /usr/local/bin/vinoauthface
          test ! -e /etc/pam.d/kde-fingerprint
          grep -qE '^auth +\[success=done new_authtok_reqd=done default=die\] +pam_exec\.so.*vinoauthface-auth' /etc/pam.d/kde-smartcard

      - name: Reset install (again)
        run: |
          sudo ./uninstall.sh
          test ! -e /etc/pam.d/kde-smartcard

      - name: Stage a fake release for the download-fallback branch
        run: |
          mkdir -p /tmp/fake-release
          cp target/x86_64-unknown-linux-musl/release/vinoauthface-auth /tmp/fake-release/vinoauthface-auth-x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/vinoauthface /tmp/fake-release/vinoauthface-x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/vinoauthface-unseal /tmp/fake-release/vinoauthface-unseal-x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/vinoauthface-tray /tmp/fake-release/vinoauthface-tray-x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/vinoauthface-helper /tmp/fake-release/vinoauthface-helper-x86_64-unknown-linux-musl
          (cd /tmp/fake-release && sha256sum -- * > SHA256SUMS)
          # Remove the local prebuilt binaries so deploy.sh can't fall back to branch 2 instead.
          rm -f target/x86_64-unknown-linux-musl/release/vinoauthface-auth target/x86_64-unknown-linux-musl/release/vinoauthface \
            target/x86_64-unknown-linux-musl/release/vinoauthface-unseal
          rm -f target/x86_64-unknown-linux-musl/release/vinoauthface-tray target/x86_64-unknown-linux-musl/release/vinoauthface-helper

      - name: "Branch 3: no cargo, no local binaries -> checksum-verified download"
        run: |
          sudo env PATH="/usr/sbin:/usr/bin:/sbin:/bin" FACE_AUTH_DEPLOY_RELEASE_BASE="file:///tmp/fake-release" ./deploy.sh --with-tray
          test -x /usr/local/bin/vinoauthface-auth
          cmp /usr/local/bin/vinoauthface-auth /tmp/fake-release/vinoauthface-auth-x86_64-unknown-linux-musl
          cmp /usr/local/libexec/vinoauthface-helper /tmp/fake-release/vinoauthface-helper-x86_64-unknown-linux-musl
          cmp /usr/local/libexec/vinoauthface-unseal /tmp/fake-release/vinoauthface-unseal-x86_64-unknown-linux-musl

      # The same fake release, plus a source bundle built the way release.yml builds it.
      - name: vinoauthface-upgrade installs from the source bundle
        run: |
          git archive --format=tar.gz --prefix=vinoauthface-v999/ \
            --add-virtual-file="vinoauthface-v999/VERSION:v999" \
            -o /tmp/fake-release/vinoauthface-source.tar.gz HEAD
          (cd /tmp/fake-release && rm SHA256SUMS && sha256sum -- * > SHA256SUMS)
          upgrade() {
            sudo env PATH="/usr/sbin:/usr/bin:/sbin:/bin" FACE_AUTH_DEPLOY_RELEASE_BASE="file:///tmp/fake-release" \
              /usr/local/bin/vinoauthface-upgrade "$@"
          }
          upgrade v999
          test "$(cat "$HOME/.cache/vinoauthface/src/v999/VERSION")" = v999
          test "$(readlink /usr/local/bin/vinoauthface-update)" = vinoauthface-upgrade
          test "$(stat -c %U "$HOME/.cache/vinoauthface/src/v999/deploy.sh")" = "$(id -un)"
          cmp /usr/local/bin/vinoauthface-auth /tmp/fake-release/vinoauthface-auth-x86_64-unknown-linux-musl
          # Asking for v998 fetches the v999 bundle from the override: refused.
          if upgrade v998; then echo "installed a bundle for the wrong release"; exit 1; fi
          # A bundle SHA256SUMS doesn't match: refused before anything unpacks.
          echo tampered >> /tmp/fake-release/vinoauthface-source.tar.gz
          if upgrade v999 --force; then echo "installed a tampered bundle"; exit 1; fi
          sudo ./uninstall.sh
          test ! -e /usr/local/bin/vinoauthface-upgrade
          test ! -L /usr/local/bin/vinoauthface-update

      - name: Cleanup
        if: always()
        run: |
          [ -d "$HOME/.cargo/bin.hidden" ] && mv "$HOME/.cargo/bin.hidden" "$HOME/.cargo/bin" || true
          sudo ./uninstall.sh || true
          sudo rm -f /etc/pam.d/swaylock /etc/pam.d/gdm-password /etc/pam.d/face-auth-ci-stack

  # The OpenVINO backend, provisioned the way deploy.sh does it on a real
  # machine: ovfetch on PATH, sudo ./deploy.sh. The runner has no NPU, so
  # ovfetch picks the newest build, and the models are compiled for OpenVINO's
  # CPU plugin instead. That still proves the libraries load with no
  # plugins.xml, through the rpath, from a set-group-ID binary.
  npu:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        # Explicit so steps get pipefail: `deploy.sh | tee` must fail with deploy.sh.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The latest release, not a pinned one: deploy.sh users get new ovfetch
      # releases as soon as they update, so CI should too. What pins it is the
      # signed provenance: the binary must have been built by ovfetch's own
      # release workflow.
      - name: Install ovfetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo karanshukla/ovfetch --pattern ovfetch-x86_64-linux -D "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/ovfetch-x86_64-linux" --repo karanshukla/ovfetch \
            --signer-workflow karanshukla/ovfetch/.github/workflows/release.yml
          sudo install -m 0755 "$RUNNER_TEMP/ovfetch-x86_64-linux" /usr/local/bin/ovfetch
          ovfetch --version

      - name: Clippy and tests with the npu feature
        run: |
          ovfetch install --prefix "$RUNNER_TEMP/ov"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/ov"
          cargo clippy --locked --workspace --all-targets --features face-auth-core/npu -- -D warnings
          cargo test --locked --workspace --features face-auth-core/npu

      - name: Deploy through ovfetch
        run: |
          sudo ./deploy.sh | tee "$RUNNER_TEMP/deploy.log"
          grep -q 'via ovfetch' "$RUNNER_TEMP/deploy.log"
          grep -q '^backend = "openvino"' /etc/face-auth.toml
          ovfetch verify --prefix /usr/local/lib/face-auth/openvino
          # ovfetch#15: TBB dlopens its allocator by SONAME.
          test -e /usr/local/lib/face-auth/openvino/libtbbmalloc.so.2
          test ! -e /etc/ld.so.conf.d/face-auth-openvino.conf
          readelf -d /usr/local/bin/vinoauthface-auth | grep -q 'RPATH.*/usr/local/lib/face-auth/openvino'
          ldd /usr/local/bin/vinoauthface-auth | grep -q 'libopenvino_c.*/usr/local/lib/face-auth/openvino/'
          # Its SELinux domain can't read OpenVINO, so it must not link it.
          ! ldd /usr/local/libexec/vinoauthface-unseal | grep -q openvino

      - name: Redeploy reuses the verified prefix
        run: |
          sudo ./deploy.sh | tee "$RUNNER_TEMP/redeploy.log"
          grep -q 'via ovfetch (installed, hashes verified)' "$RUNNER_TEMP/redeploy.log"

      - name: update.sh rebuilds the NPU backend with the same rpath
        run: |
          sudo ./update.sh | tee "$RUNNER_TEMP/update.log"
          grep -q 'NPU backend' "$RUNNER_TEMP/update.log"
          readelf -d /usr/local/bin/vinoauthface-auth | grep -q 'RPATH.*/usr/local/lib/face-auth/openvino'
          test "$(stat -c %G:%a /usr/local/bin/vinoauthface-auth)" = face-auth:2755

      - name: Compile the models on the CPU plugin
        run: |
          echo 'npu_device = "CPU"' | sudo tee -a /etc/face-auth.toml
          sudo vinoauthface-auth --warm-cache

      # Not root, so the set-group-ID bit puts glibc in secure mode. With no
      # PAM_USER it exits 1 after loading; a loader failure would exit 127.
      - name: Libraries load in secure mode
        run: |
          set +e
          env -i /usr/local/bin/vinoauthface-auth 2> "$RUNNER_TEMP/err"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/err"
          test "$rc" = 1
          ! grep -q 'error while loading shared libraries' "$RUNNER_TEMP/err"

      - name: Uninstall removes the prefix
        run: |
          sudo ./uninstall.sh
          test ! -e /usr/local/lib/face-auth
