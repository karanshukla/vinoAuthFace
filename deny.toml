# Checked in CI (`deny` job). face-auth runs as root inside PAM, so every
# dependency is code that decides who gets a root shell.
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]

[advisories]
yanked = "deny"
ignore = [
    # paste: unmaintained proc-macro, no successor release. Pulled in by tract
    # and image's codec stack at compile time only.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro, no safe upgrade" },
    # zbus_names, zvariant, zvariant_derive: merged into zbus 6.0.0, so the
    # standalone crates are flagged unmaintained. Only reached through
    # ksni 0.3 -> zbus 5 in the tray, never linked into face-auth (the PAM
    # binary). No safe upgrade until ksni moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: tray-only via ksni/zbus 5, no safe upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: tray-only via ksni/zbus 5, no safe upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: tray-only via ksni/zbus 5, no safe upgrade" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Zlib"]
# Scoped per crate rather than allowed globally.
exceptions = [
    # dirs -> dirs-sys -> option-ext. MPL is file-level copyleft: it covers
    # that crate's own files, not the binary linking it.
    { crate = "option-ext", allow = ["MPL-2.0"] },
    # Public-domain dedication.
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
    # Public-domain dedication. The tray's StatusNotifierItem; never linked
    # into face-auth.
    { crate = "ksni", allow = ["Unlicense"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; they are publish = false.
allow-wildcard-paths = true

# Only crates.io. A git dependency or a second registry is a new party to trust.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
