[package]
name = "face-auth"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish.workspace = true

[[bin]]
name = "vinoauthface-auth"
path = "src/main.rs"

# Std only, and not linked against face-auth-core: it runs in its own SELinux
# domain, which should load nothing but libc (and, for npu builds, OpenVINO
# must not come along).
[[bin]]
name = "vinoauthface-unseal"
path = "src/unseal.rs"

[dependencies]
face-auth-core = { path = "../face-auth-core" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = "0.2"

[features]
npu = ["face-auth-core/npu"]
