[package]
name = "face-auth-tray"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish.workspace = true
autobins = false

[[bin]]
name = "vinoauthface-tray"
path = "src/main.rs"

[[bin]]
name = "vinoauthface-helper"
path = "src/bin/vinoauthface-helper.rs"

[dependencies]
face-auth-core = { path = "../face-auth-core" }
anyhow = { workspace = true }
libc = "0.2"
# Pure Rust StatusNotifierItem over zbus; zbus again for notifications.
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[features]
npu = ["face-auth-core/npu"]
